<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>__TITLE__</title>
  </head>
  <body>
    <!-- Rise looks up #view (canvas), #ui (HUD) and #boot (loading screen) by id. Keep this structure. -->
    <div id="app">
      <canvas id="view" tabindex="0"></canvas>
      <div id="ui"></div>
      <div id="boot">
        <div class="boot-mark">RISE</div>
        <div class="boot-sub" id="boot-msg">Loading...</div>
        <div class="boot-bar"><i id="boot-fill"></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
